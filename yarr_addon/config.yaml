name: yArr
version: "0.1.0"
slug: yarr
description: Automated movie discovery, surprise-film rotation and library trimming across TMDB/Radarr/Jellyfin (bundled AppDaemon)
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
init: false
hassio_api: true
homeassistant_api: true
hassio_role: default
ingress: true
ingress_port: 8100
panel_icon: mdi:movie-open-star
panel_title: yArr
map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    read_only: false
# Real credentials for the three external services — Radarr/Jellyfin API
# keys and a TMDB API key. AppDaemon's own apps.yaml loader has no
# !secret support (a bad tag there silently kills the whole app — see
# the run script's self-heal), so these live here instead, where
# Supervisor's Configuration tab masks every `password` field and
# stores it itself. They never touch apps.yaml. Everything non-secret
# (genres, rating floor, cadence, Radarr root folder/quality profile,
# surprise tag, grace period) lives in a hand-edited apps.yaml instead
# — see apps.yaml.example.
#
# jellyfin_url/jellyfin_api_key are required (not just an optional
# webhook fallback) — watch-history exclusion reads Jellyfin's own
# per-user played status directly, since TMDB has no concept of "what
# have I watched" the way a personal Trakt/Plex account would.
options:
  radarr_url: ""
  radarr_api_key: ""
  jellyfin_url: ""
  jellyfin_api_key: ""
  tmdb_api_key: ""
schema:
  radarr_url: url
  radarr_api_key: password
  jellyfin_url: url
  jellyfin_api_key: password
  tmdb_api_key: password
