name: yArr
version: "0.13.0"
slug: yarr
description: Automated movie/TV discovery, surprise rotation and library trimming across TMDB/Radarr/Sonarr/Jellyfin, with optional SABnzbd monitoring and NAS duplicate-media scanning (bundled AppDaemon)
url: https://github.com/james-autho-tech/yarr
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8100
panel_icon: mdi:movie-open-star
panel_title: yArr
# No homeassistant_config mount — HA-side helpers/automation are
# created through the Core Config REST API instead of a written
# package file (see the `run` script), which needs nothing beyond the
# hassio_api/homeassistant_api access below. Deliberately avoids the
# homeassistant_config:rw + Protection-mode dependency: a real install
# showed that map entry can silently stay unmounted even when
# correctly declared, blocking the helpers from ever being created.
map:
  - type: addon_config
    read_only: false
  # Write access — the duplicate-media scan (apps.yaml's media_scan_paths)
  # reports candidate groups, and the web UI's per-file Delete button
  # removes a chosen file directly off this mount (only ever a path that
  # was actually part of the last scan's results — never an arbitrary
  # path, see yarr.py's on_delete_duplicate_file). Requires HA's own
  # /media share to actually be pointed at your NAS first (Settings →
  # System → Storage → Add Network Storage, Usage: Media) — this map
  # entry alone doesn't grant access to anything if that hasn't been
  # set up, it just mounts whatever HA itself considers /media.
  - type: media
    read_only: false
# Real credentials for every external service yArr talks to.
# AppDaemon's own apps.yaml loader has no !secret support (a bad tag
# there silently kills the whole app — see the run script's
# self-heal), so these live here instead, where Supervisor's
# Configuration tab masks every `password` field and stores it itself.
# They never touch apps.yaml. Everything non-secret (genres, rating
# floor, cadence, root folders/quality profiles, surprise tags, grace
# period) lives in a hand-edited apps.yaml instead — see
# apps.yaml.example.
#
# Required: radarr_url/radarr_api_key, tmdb_api_key, jellyfin_url/
# jellyfin_api_key (watch-history exclusion reads Jellyfin's own
# per-user played status directly, since TMDB has no concept of "what
# have I watched" the way a personal account would).
# Optional: sonarr_url/sonarr_api_key (TV support — leave blank to run
# movies-only) and sabnzbd_url/sabnzbd_api_key (read-only queue
# monitoring — leave blank to skip it entirely).
options:
  radarr_url: ""
  radarr_api_key: ""
  sonarr_url: ""
  sonarr_api_key: ""
  jellyfin_url: ""
  jellyfin_api_key: ""
  tmdb_api_key: ""
  sabnzbd_url: ""
  sabnzbd_api_key: ""
schema:
  # Plain str, not url — HA's `url` schema type validates the value as
  # an actual URL even for an optional field, and an empty-string
  # default (needed so sonarr_url/sabnzbd_url can be left blank to stay
  # opt-out) fails that check with "expected a URL". str/str? has no
  # such format validation, matching the pattern this family of add-ons
  # already uses for its other optional string fields.
  radarr_url: str
  radarr_api_key: password
  sonarr_url: str?
  sonarr_api_key: password?
  jellyfin_url: str
  jellyfin_api_key: password
  tmdb_api_key: password
  sabnzbd_url: str?
  sabnzbd_api_key: password?
