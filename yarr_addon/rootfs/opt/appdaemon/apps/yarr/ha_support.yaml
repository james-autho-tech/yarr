# =====================================================================
# yArr — HA-side support, REFERENCE ONLY.
#
# The add-on creates these same helpers and this same automation
# automatically on every start via HA's Core Config REST API
# (/api/config/<domain>/config/<id> — see the `run` script) — nothing
# here needs to be hand-installed. This file exists purely as a
# readable equivalent, and as a manual fallback: if you'd rather manage
# it yourself, save this as /config/packages/yarr.yaml (needs
# `homeassistant: packages: !include_dir_named packages`) and it does
# the same job, minus the auto-sync-on-update the API path gives you.
#
# Why this exists at all rather than being pure AppDaemon:
# - input_boolean/input_button must be real HA helpers to be toggleable
#   from the UI/dashboards, not just AppDaemon-set virtual states
# - Jellyfin's Webhook plugin needs a plain, externally-POSTable URL;
#   Supervisor's Ingress proxy is authenticated and not reachable that
#   way, so HA core's own `webhook` automation trigger does the job
#   instead — see DOCS.md for the Jellyfin-side setup this expects.
#
# There is no deadman-switch watchdog here: a stuck AppDaemon just
# means stale recommendations or a delayed deletion, nothing
# physically unsafe to revert — the delete grace-period poll (yarr.py's
# tick_delete_guard) is itself already restart-safe.
# =====================================================================

input_boolean:
  yarr_enable:
    name: yArr Engine Master Switch
    icon: mdi:movie-open-play
    initial: on
  yarr_keep_surprise:
    name: "yArr: Keep the pending surprise film"
    icon: mdi:heart
    initial: off
  # Separate from yarr_keep_surprise so a pending movie deletion and a
  # pending show deletion can't accidentally cross-cancel each other.
  yarr_keep_surprise_tv:
    name: "yArr: Keep the pending surprise show"
    icon: mdi:heart
    initial: off

input_button:
  yarr_surprise_me_now:
    name: "yArr: Surprise Me Now"
    icon: mdi:dice-multiple
  # Only useful once Sonarr is configured in the add-on's Configuration
  # tab — harmless to leave visible either way.
  yarr_surprise_tv_now:
    name: "yArr: Surprise Me Now (TV)"
    icon: mdi:dice-multiple-outline

automation:
  - alias: "yArr Jellyfin playback-stop relay"
    description: >
      Re-fires Jellyfin's Webhook-plugin PlaybackStop payload (for both
      Movie and Episode items) as a plain HA event yarr.py subscribes
      to via listen_event() — see DOCS.md for the Jellyfin-side webhook
      template this expects.
    mode: queued
    triggers:
      - trigger: webhook
        webhook_id: yarr_playback_stop
        local_only: true
        allowed_methods: [POST]
    actions:
      - event: yarr_jellyfin_webhook
        event_data:
          payload: "{{ trigger.json }}"
