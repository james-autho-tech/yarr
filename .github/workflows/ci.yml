name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run core test suite (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest yarr_addon/tests/ -q

  lint-addon:
    name: Validate yarr_addon/config.yaml against HA's add-on schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Home Assistant Add-on Linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./yarr_addon"

  syntax-check:
    name: Python/shell syntax check on every shipped file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax (ast.parse)
        run: |
          for f in yarr_addon/rootfs/opt/appdaemon/apps/yarr/yarr.py \
                   yarr_addon/rootfs/opt/appdaemon/apps/yarr/core/*.py \
                   yarr_addon/rootfs/opt/appdaemon/apps/yarr/clients/*.py \
                   yarr_addon/rootfs/opt/yarr-web/webui.py; do
            python3 -c "import ast; ast.parse(open('$f').read())" || exit 1
          done
      - name: Shell syntax (bash -n)
        run: bash -n yarr_addon/rootfs/etc/services.d/yarr/run
      - name: YAML syntax on shipped config/support files
        run: |
          pip install pyyaml
          for f in repository.yaml yarr_addon/config.yaml \
                   yarr_addon/rootfs/opt/appdaemon/apps/yarr/apps.yaml.example \
                   yarr_addon/rootfs/opt/appdaemon/apps/yarr/ha_support.yaml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done
      - name: Web UI embedded JS syntax (esprima)
        # webui.py's PAGE is a plain (non-raw) Python string, so a
        # backslash meant to escape a quote for the BROWSER's JS parser
        # gets silently consumed by Python's own string literal parsing
        # first — the classic way this breaks is a nested quote inside
        # a JS string that looks fine in the source but ships broken,
        # taking out the entire <script> block with no visible error
        # (confirmed by a real instance of exactly this in 0.11.0).
        run: |
          pip install esprima
          SUPERVISOR_TOKEN=x python3 -c "
          import re, esprima
          import sys
          sys.path.insert(0, 'yarr_addon/rootfs/opt/yarr-web')
          import webui
          js = re.search(r'<script>(.*)</script>', webui.PAGE, re.S).group(1)
          esprima.parseScript(js)
          print('Web UI JS syntax OK')
          "

  webui-smoke:
    name: Web UI browser smoke test (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pytest playwright
          python3 -m playwright install --with-deps chromium
      - name: Load the actual generated page in headless Chromium and
          click every action button
        # Neither pytest's core/ suite nor the esprima syntax check
        # above executes webui.py's JS in a real engine — both of the
        # real regressions that shipped (a broken onclick from a
        # JSON-stringified path colliding with its own attribute
        # quotes; a nested-quote JS syntax error that killed the whole
        # <script> block) were runtime/DOM failures that only a real
        # browser would catch. This loads the page with fixture data
        # and clicks every button, asserting nothing throws.
        run: python3 -m pytest yarr_addon/tests/test_webui_smoke.py -v

  docker-build:
    name: Build the add-on's Docker image (amd64)
    runs-on: ubuntu-latest
    # Nothing else in this workflow ever actually builds the image —
    # pytest/esprima/Playwright all exercise the Python/JS source
    # directly, and the addon-linter only validates config.yaml's
    # schema. A broken Dockerfile (a bad COPY path, chmod on a file
    # that no longer exists, a pip install failure) would only ever
    # surface when a real user tries to install or update the add-on —
    # which fails much harder than any bug fixed so far: the add-on
    # can't run at all. This builds it for real on every push.
    steps:
      - uses: actions/checkout@v4
      - name: Extract the amd64 base image from build.yaml
        id: base
        run: |
          pip install pyyaml
          IMAGE=$(python3 -c "import yaml; d = yaml.safe_load(open('yarr_addon/build.yaml')); print(d['build_from']['amd64'])")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_FROM=${{ steps.base.outputs.image }} \
            -t yarr-addon-ci-build \
            ./yarr_addon
